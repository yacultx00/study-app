services:
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      MESSAGE: Hello from Compose

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: study
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
